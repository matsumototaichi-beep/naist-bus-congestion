<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バス混雑度 計測</title>
<style>
  :root{
    --c1:#16a34a; --c2:#65a30d; --c3:#ca8a04; --c4:#ea580c; --c5:#dc2626; --c6:#991b1b;
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#f1f5f9; --muted:#94a3b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  }
  header{flex:0 0 auto; padding:8px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); background:var(--panel);}
  .sess{flex:1; min-width:0; font-size:12px; color:var(--muted); line-height:1.3;}
  .sess b{color:var(--ink); font-weight:600;}
  .iconbtn{flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:7px 11px; font-size:13px; font-weight:600;}

  main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}

  .picker{flex:0 0 auto; padding:8px 10px; border-bottom:1px solid var(--line);}
  .ptitle{font-size:12px; color:var(--muted); margin:0 2px 6px;}
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .card{
    border:none; border-radius:12px; color:#fff; font-family:inherit; padding:7px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    transition:transform .06s ease;
  }
  .card:active{transform:scale(.94);}
  .card .num{font-size:18px; font-weight:800;}
  .card .lbl{font-size:11px; font-weight:700; line-height:1.1;}
  .card .rng{font-size:10px; opacity:.9;}
  .c1{background:var(--c1);} .c2{background:var(--c2);} .c3{background:var(--c3);}
  .c4{background:var(--c4);} .c5{background:var(--c5);} .c6{background:var(--c6);}

  .log{flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px 10px 14px;}
  .lhead{position:sticky; top:0; background:var(--bg); font-size:12px; color:var(--muted); padding:6px 2px; display:flex; justify-content:space-between; align-items:center;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:28px 10px;}
  .logrow{display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid #1e2a3d;}
  .chip{flex:0 0 auto; width:26px; height:26px; border-radius:7px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .lt{flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); width:42px;}
  .lmid{flex:1 1 auto; min-width:0;}
  .lcount{font-size:15px; font-weight:700;}
  .lsub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lstat{flex:0 0 auto; font-size:11px; color:var(--muted); text-align:right;}
  .lstat.ok{color:#34d399;} .lstat.pend{color:#fbbf24;} .lstat.rec{color:#60a5fa;}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:16px;}
  .center h2{margin:0; font-size:18px; font-weight:700;}
  .center .hint{color:var(--muted); font-size:13px; margin:0;}
  .selchip{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .selchip .chip{width:24px; height:24px;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:58px; height:58px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:20px; font-weight:700;}
  .stepper button:active{background:var(--line);}
  .count{min-width:110px; font-size:46px; font-weight:800;}
  .row{display:flex; gap:10px; width:100%; max-width:420px;}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:700; font-family:inherit; color:#fff;}
  .btn.primary{background:#2563eb;} .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.gh{background:#24292f; display:inline-flex; align-items:center; justify-content:center; gap:10px;}
  .btn:active{filter:brightness(.9);}
  .btn:disabled{opacity:.5;}

  .statusbar{flex:0 0 auto; padding:6px 12px; font-size:12px; color:var(--muted); text-align:center; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .statusbar.warn{background:#7c2d12; color:#fed7aa;}

  .toast{position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px); opacity:0; background:#16a34a; color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700; transition:all .2s ease; pointer-events:none; z-index:30;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* login screen */
  .login{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;}
  .login h1{font-size:22px; margin:0;}
  .login p{color:var(--muted); font-size:14px; margin:0; max-width:340px; line-height:1.5;}
  .login .btn{flex:0 0 auto; width:100%; max-width:320px;}
  .authtabs{display:flex; gap:6px; width:100%; max-width:320px;}
  .atab{flex:1; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:11px; padding:10px; font-size:14px; font-weight:700; font-family:inherit;}
  .atab.on{background:var(--panel); color:var(--ink); border-color:#2563eb;}
  .authform{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}
  .afield{width:100%; padding:13px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:16px; font-family:inherit;}
  .authform .btn{max-width:none;}
  #authNote{color:#fca5a5; font-size:12px; min-height:16px; margin:0;}
</style>
</head>
<body>

<header id="hdr" style="display:none">
  <div class="sess" id="sess"></div>
  <button class="iconbtn" id="langBtn">EN</button>
  <button class="iconbtn" id="outBtn">⎋</button>
</header>

<main id="main"></main>

<div class="statusbar" id="status"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   バス混雑度 HITL 収集アプリ (Phase A)
   - GitHubログイン(Supabase Auth OAuth)
   - 回答者が押すのは「クラス＋人数」だけ
   - 軌跡(2〜3秒間隔・約40秒)/時刻/surveyor_id は自動付与
   - 保存先: Supabase responses（失敗時は端末に退避して再送）
   ---- 下の2値に Supabase の値を入れてください ----
   ========================================================== */
const SUPABASE_URL      = "https://qhfegbptgkgccwdnrnas.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SZKczNkJSCrilMnACZ4Xnw_CV5UeZWN";  // 公開してよい publishable key
const APP_VERSION = "phaseA-0.3";

/* 軌跡サンプリング設定 */
const SAMPLE_MS = 2500;   // サンプル間隔(約2.5秒)
const WINDOW_MS = 40000;  // 1回答あたりの軌跡ウィンドウ(約40秒)
const POST_SUBMIT_MIN_MS = 8000; // 送信後に最低これだけ測位を続ける
const WINDOW_MAX_MS = 60000;
const OUTBOX_KEY = "bus_outbox_v1";

const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
let sb = null, user = null;
if (configured) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' }
});

const $ = (id)=>document.getElementById(id);
const main = $("main");
let lang = "ja";
let pending = null;         // 回答中レコード
let finalizeTimer = null;   // 送信後の確定タイマー
let countdownTimer = null;
const logEntries = [];      // 画面表示用(新しい順)

/* ---------------- i18n ---------------- */
const T = {
  ja:{
    auth_title:"バス混雑度 計測",
    auth_intro:"NAIST共同研究の教師データ収集です。メールアドレスで登録／ログインしてください。回答はクラスと人数だけ、位置と時刻は自動で記録されます。",
    tab_login:"ログイン", tab_signup:"新規登録",
    ph_name:"表示名（調査員名）", ph_email:"メールアドレス", ph_pass:"パスワード（8文字以上）",
    do_login:"ログイン", do_signup:"登録して確認メールを送る", signing:"処理中…",
    sent_title:"確認メールを送信しました",
    sent_desc:(e)=>`${e} 宛に確認メールを送りました。<b>同じ端末のこのブラウザ</b>でメール内のリンクを開くと、ここに戻って自動でログインします。`,
    resend:"確認メールを再送", to_login:"ログインへ戻る", resent:"再送しました",
    err_login:"メールまたはパスワードが違います", err_unconfirmed:"メール確認が未完了です。受信した確認メールのリンクを開いてください。",
    err_pass:"パスワードは8文字以上にしてください", err_email:"メールアドレスを入力してください", err_name:"表示名を入力してください",
    login_wait:"処理中…",
    pick:"混雑度を選択", records:"記録", none:"まだ記録がありません",
    classes:[
      {lbl:"ガラガラ", rng:"0〜5人"},{lbl:"やや空き", rng:"6〜15人"},{lbl:"席が埋まる", rng:"16〜25人"},
      {lbl:"立ち客", rng:"26〜40人"},{lbl:"混雑", rng:"41〜55人"},{lbl:"満員近い", rng:"56人〜"},
    ],
    countTitle:"正確な人数（任意）", countHint:"数えられれば入力してください",
    send:"この人数で送信", skip:"人数はスキップ", ppl:"人",
    saved:"保存しました", queued:"端末に保存（後で自動送信）", finishing:"軌跡を記録中",
    saveNow:"今すぐ保存", recording:"記録中", pendingN:(n)=>`未送信 ${n}件`,
    gpsOn:"位置情報 取得中…", gpsOk:"位置情報 OK", gpsNo:"位置情報が取得できません（許可が必要）",
    who:(h)=>`調査員 <b>${h}</b>`, langLabel:"EN",
    notconf:"バックエンド未設定（管理者に連絡）",
  },
  en:{
    auth_title:"Bus crowding logger",
    auth_intro:"HITL data collection for the NAIST study. Register / sign in with your email. You only tap class and count; location and time are recorded automatically.",
    tab_login:"Sign in", tab_signup:"Sign up",
    ph_name:"Display name (surveyor)", ph_email:"Email", ph_pass:"Password (8+ chars)",
    do_login:"Sign in", do_signup:"Sign up & send confirmation", signing:"Working…",
    sent_title:"Confirmation email sent",
    sent_desc:(e)=>`We sent a confirmation email to ${e}. Open the link <b>in this same browser</b> and you'll return here signed in.`,
    resend:"Resend confirmation", to_login:"Back to sign in", resent:"Resent",
    err_login:"Wrong email or password", err_unconfirmed:"Email not confirmed yet. Open the link in the confirmation email.",
    err_pass:"Password must be at least 8 characters", err_email:"Enter your email", err_name:"Enter a display name",
    login_wait:"Working…",
    pick:"Select crowding", records:"Records", none:"No records yet",
    classes:[
      {lbl:"Empty", rng:"0–5"},{lbl:"Light", rng:"6–15"},{lbl:"Seats full", rng:"16–25"},
      {lbl:"Standing", rng:"26–40"},{lbl:"Crowded", rng:"41–55"},{lbl:"Packed", rng:"56+"},
    ],
    countTitle:"Exact count (optional)", countHint:"Enter it if you can count",
    send:"Submit count", skip:"Skip count", ppl:"",
    saved:"Saved", queued:"Saved on device (will auto-send)", finishing:"Recording trajectory",
    saveNow:"Save now", recording:"recording", pendingN:(n)=>`${n} unsent`,
    gpsOn:"Getting location…", gpsOk:"Location OK", gpsNo:"No location (permission needed)",
    who:(h)=>`Surveyor <b>${h}</b>`, langLabel:"日本語",
    notconf:"Backend not configured (contact admin)",
  }
};

/* ---------------- helpers ---------------- */
function toast(msg,color){ const el=$("toast"); el.textContent=msg; el.style.background=color||"#16a34a"; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1500); }
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nowSec(){ return Math.floor(Date.now()/1000); }
function handleName(){
  if(!user) return "—";
  const m=user.user_metadata||{};
  return m.display_name || m.name || (user.email||"").split("@")[0] || user.id.slice(0,8);
}
function setStatus(msg,warn){
  const s=$("status"); const n=outbox().length;
  let base = msg||"";
  if(n>0) base = (base?base+" · ":"") + T[lang].pendingN(n);
  s.textContent = base;
  s.className = "statusbar" + (warn?" warn":"");
}

/* ---------------- outbox (端末退避＆再送) ---------------- */
function outbox(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]"); }catch(e){ return []; } }
function saveOutbox(a){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function outboxUpsert(item){ const a=outbox(); const i=a.findIndex(x=>x.cid===item.cid); if(i>=0)a[i]=item; else a.push(item); saveOutbox(a); }
function outboxRemove(cid){ saveOutbox(outbox().filter(x=>x.cid!==cid)); }

async function insertRecord(rec){
  // rec: {answered_at, congestion_class, exact_count, trajectory, lang, app_version}
  const { error } = await sb.from("responses").insert(rec);
  if(error) throw error;
}
async function flushOutbox(){
  if(!user) return;
  for(const item of outbox().filter(x=>x.ready)){
    try{ await insertRecord(item.rec); outboxRemove(item.cid);
      const e=logEntries.find(x=>x.cid===item.cid); if(e){ e.state="ok"; }
    }catch(err){ /* keep for next time */ }
  }
  renderMain(); setStatus();
}

/* ---------------- GPS 軌跡サンプリング ---------------- */
let watchId=null, lastSampleTs=0, geoOk=false;
function startSampling(){
  if(watchId!=null) return;
  if(!navigator.geolocation){ setStatus(T[lang].gpsNo,true); return; }
  setStatus(T[lang].gpsOn);
  watchId = navigator.geolocation.watchPosition(
    (p)=>{
      geoOk=true;
      const now=Date.now();
      if(now-lastSampleTs < SAMPLE_MS-300) return;   // 約2.5秒間隔に間引き
      lastSampleTs=now;
      if(pending && pending.trajectory){
        pending.trajectory.push({ t:nowSec(), lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy) });
        // 進行中レコードをoutboxにも反映(クラッシュ耐性)
        if(pending.cid) syncPendingToOutbox(false);
      }
      setStatus(T[lang].gpsOk);
    },
    (e)=>{ setStatus(T[lang].gpsNo,true); },
    { enableHighAccuracy:true, maximumAge:1000, timeout:8000 }
  );
}
function stopSampling(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ---------------- 回答フロー ---------------- */
function pickClass(cls){
  // 直前の回答が確定待ちなら即確定
  if(pending) finalizeNow(true);
  pending = { cid: crypto.randomUUID(), congestion_class:cls, exact_count:null,
              answered_at:new Date().toISOString(), firstTs:Date.now(), trajectory:[] };
  startSampling();
  renderCount();
}

function renderCount(){
  const t=T[lang], n0=0; let n=n0;
  const cls=t.classes[pending.congestion_class-1];
  main.innerHTML = `
    <div class="center">
      <div class="selchip"><span class="chip c${pending.congestion_class}">${pending.congestion_class}</span>${cls.lbl}（${cls.rng}）</div>
      <h2>${t.countTitle}</h2><p class="hint">${t.countHint}</p>
      <div class="stepper">
        <button data-d="-10">−10</button><button data-d="-1">−</button>
        <div class="count" id="cval">0</div>
        <button data-d="1">＋</button><button data-d="10">+10</button>
      </div>
      <div class="row"><button class="btn primary" id="sendBtn">${t.send}</button></div>
      <div class="row"><button class="btn ghost" id="skipBtn">${t.skip}</button></div>
    </div>`;
  const cval=$("cval");
  const show=()=>{ cval.textContent = n>=70?"70+":n; };
  main.querySelectorAll(".stepper button").forEach(b=>{ b.onclick=()=>{ n=Math.max(0,Math.min(70,n+parseInt(b.dataset.d,10))); show(); }; });
  $("sendBtn").onclick=()=>{ pending.exact_count=n; submit(); };
  $("skipBtn").onclick=()=>{ pending.exact_count=null; submit(); };
}

function buildRec(p){
  return { answered_at:p.answered_at, congestion_class:p.congestion_class,
           exact_count:p.exact_count, trajectory:p.trajectory,
           lang:lang, app_version:APP_VERSION };
}
function syncPendingToOutbox(ready){
  if(!pending) return;
  outboxUpsert({ cid:pending.cid, ready:!!ready, rec:buildRec(pending) });
}

function submit(){
  // 画面ログに「記録中」で追加
  const entry={ cid:pending.cid, congestion_class:pending.congestion_class,
                exact_count:pending.exact_count, answered_at:pending.answered_at, state:"rec" };
  logEntries.unshift(entry);
  syncPendingToOutbox(false);   // 未確定として退避(クラッシュ耐性)
  // 送信後もしばらく測位を続け、ウィンドウ到達で確定
  const now=Date.now();
  let target = pending.firstTs + WINDOW_MS;
  target = Math.max(target, now + POST_SUBMIT_MIN_MS);
  target = Math.min(target, pending.firstTs + WINDOW_MAX_MS);
  pending.finalizeAt = target;
  renderMain();
  startCountdown();
  finalizeTimer = setTimeout(()=>finalizeNow(false), Math.max(0, target-now));
}

function startCountdown(){
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    if(!pending){ clearInterval(countdownTimer); return; }
    const remain=Math.max(0,Math.ceil((pending.finalizeAt-Date.now())/1000));
    const e=logEntries.find(x=>x.cid===pending.cid);
    if(e){ e.remain=remain; e.npts=pending.trajectory.length; renderMain(); }
    if(remain<=0){ clearInterval(countdownTimer); }
  }, 1000);
}

async function finalizeNow(immediate){
  if(!pending) return;
  clearTimeout(finalizeTimer); finalizeTimer=null;
  clearInterval(countdownTimer);
  const p=pending; pending=null;
  const rec=buildRec(p);
  const entry=logEntries.find(x=>x.cid===p.cid);
  // 送信試行
  let ok=false;
  if(user){
    try{ await insertRecord(rec); ok=true; outboxRemove(p.cid); }
    catch(err){ ok=false; }
  }
  if(!ok){ outboxUpsert({ cid:p.cid, ready:true, rec }); }
  if(entry){ entry.state = ok?"ok":"pend"; entry.npts=p.trajectory.length; delete entry.remain; }
  renderMain(); setStatus();
  toast(ok?T[lang].saved:T[lang].queued, ok?"#16a34a":"#f59e0b");
  // 次の測位は次のpickClassで開始。バッテリのため停止。
  stopSampling();
}

/* ---------------- 画面描画 ---------------- */
function renderMain(){
  const t=T[lang];
  $("hdr").style.display="";
  $("sess").innerHTML=t.who(handleName());
  $("langBtn").textContent=t.langLabel;
  let cards="";
  t.classes.forEach((c,i)=>{ cards+=`<button class="card c${i+1}" onclick="pickClass(${i+1})"><div class="num">${i+1}</div><div class="lbl">${c.lbl}</div><div class="rng">${c.rng}</div></button>`; });
  let rows="";
  if(logEntries.length===0){ rows=`<div class="empty">${t.none}</div>`; }
  else{
    logEntries.forEach(e=>{
      const cls=t.classes[e.congestion_class-1];
      const countTxt=(e.exact_count!=null)?`${e.exact_count}${t.ppl}`:`<span style="color:var(--muted)">${cls.lbl}</span>`;
      let st="", stc="";
      if(e.state==="rec"){ stc="rec"; st=`${t.recording} ${e.remain!=null?e.remain+"s":""}<br>${(e.npts||0)}pt`; }
      else if(e.state==="ok"){ stc="ok"; st=`✓ ${(e.npts||0)}pt`; }
      else if(e.state==="pend"){ stc="pend"; st=`⧗ ${(e.npts||0)}pt`; }
      rows+=`<div class="logrow">
        <span class="chip c${e.congestion_class}">${e.congestion_class}</span>
        <span class="lt">${hhmm(e.answered_at)}</span>
        <span class="lmid"><div class="lcount">${countTxt}</div><div class="lsub">${cls.lbl}</div></span>
        <span class="lstat ${stc}">${st}</span>
      </div>`;
    });
  }
  main.innerHTML = `
    <div class="picker"><p class="ptitle">${t.pick}</p><div class="grid">${cards}</div></div>
    <div class="log">
      <div class="lhead"><span>${t.records} ${logEntries.length}</span></div>
      ${rows}
    </div>`;
  setStatus();
}

/* ---------------- 認証（メール＋パスワード） ---------------- */
let authMode = "login";   // login | signup | sent
let authForm = { email:"", pass:"", name:"", sentEmail:"" };

function renderAuth(){
  const t=T[lang];
  $("hdr").style.display="none";
  if(authMode==="sent"){
    main.innerHTML=`
      <div class="login">
        <h1>${t.sent_title}</h1>
        <p>${t.sent_desc(authForm.sentEmail)}</p>
        <button class="btn ghost" id="resendBtn">${t.resend}</button>
        <button class="btn ghost" id="backBtn">${t.to_login}</button>
      </div>`;
    $("resendBtn").onclick=async()=>{
      try{ await sb.auth.resend({ type:'signup', email:authForm.sentEmail,
            options:{ emailRedirectTo: location.origin+location.pathname } });
        toast(t.resent); }catch(e){ toast(e.message||"error","#dc2626"); }
    };
    $("backBtn").onclick=()=>{ authMode="login"; renderAuth(); };
    setStatus(configured?"":T[lang].notconf, !configured);
    return;
  }
  const isSignup = authMode==="signup";
  main.innerHTML=`
    <div class="login">
      <h1>${t.auth_title}</h1>
      <p>${t.auth_intro}</p>
      <div class="authtabs">
        <button class="atab ${!isSignup?'on':''}" id="tabLogin">${t.tab_login}</button>
        <button class="atab ${isSignup?'on':''}" id="tabSignup">${t.tab_signup}</button>
      </div>
      <div class="authform">
        ${isSignup?`<input class="afield" id="fName" type="text" placeholder="${t.ph_name}" autocomplete="name" value="${authForm.name||''}">`:``}
        <input class="afield" id="fEmail" type="email" inputmode="email" autocapitalize="none" autocomplete="email" placeholder="${t.ph_email}" value="${authForm.email||''}">
        <input class="afield" id="fPass" type="password" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="${t.ph_pass}" value="${authForm.pass||''}">
        <button class="btn primary" id="authBtn">${isSignup?t.do_signup:t.do_login}</button>
        <p class="hint" id="authNote"></p>
      </div>
    </div>`;
  $("tabLogin").onclick=()=>{ grabAuth(); authMode="login"; renderAuth(); };
  $("tabSignup").onclick=()=>{ grabAuth(); authMode="signup"; renderAuth(); };
  $("authBtn").onclick=submitAuth;
  setStatus(configured?"":T[lang].notconf, !configured);
}
function grabAuth(){
  if($("fEmail")) authForm.email=$("fEmail").value.trim();
  if($("fPass"))  authForm.pass=$("fPass").value;
  if($("fName"))  authForm.name=$("fName").value.trim();
}
function authNote(msg){ const n=$("authNote"); if(n) n.textContent=msg||""; }
async function submitAuth(){
  const t=T[lang];
  if(!configured){ toast(t.notconf,"#dc2626"); return; }
  grabAuth();
  const email=authForm.email, pass=authForm.pass;
  if(!email){ authNote(t.err_email); return; }
  if(!pass || pass.length<8){ authNote(t.err_pass); return; }
  const btn=$("authBtn"); if(btn){ btn.disabled=true; btn.textContent=t.signing; }
  try{
    if(authMode==="signup"){
      if(!authForm.name){ authNote(t.err_name); return; }
      const { data, error } = await sb.auth.signUp({ email, password:pass,
        options:{ emailRedirectTo: location.origin+location.pathname, data:{ display_name:authForm.name } } });
      if(error) throw error;
      if(data.session){ /* 確認OFF環境: 即ログイン(onAuthStateChangeが処理) */ }
      else { authForm.sentEmail=email; authMode="sent"; renderAuth(); return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error){
        const m=(error.message||"").toLowerCase();
        if(m.includes("not confirmed")||m.includes("confirm")) authNote(t.err_unconfirmed);
        else authNote(t.err_login);
        throw error;
      }
    }
  }catch(e){
    if(!$("authNote")||!$("authNote").textContent) authNote(e.message||"error");
  }finally{
    const b=$("authBtn"); if(b){ b.disabled=false; b.textContent=(authMode==="signup")?t.do_signup:t.do_login; }
  }
}

async function boot(){
  $("langBtn").onclick=()=>{ lang=(lang==="ja")?"en":"ja"; if(user) renderMain(); else renderAuth(); };
  $("outBtn").onclick=async()=>{ if(sb){ await sb.auth.signOut(); } user=null; authMode="login"; renderAuth(); };

  if(!configured){ renderAuth(); return; }

  const { data:{ session } } = await sb.auth.getSession();
  user = session ? session.user : null;
  sb.auth.onAuthStateChange((_ev, sess)=>{
    user = sess ? sess.user : null;
    if(user){ renderMain(); flushOutbox(); } else { renderAuth(); }
  });

  if(user){ renderMain(); flushOutbox(); }
  else { renderAuth(); }

  // アプリを離れた瞬間に回答中レコードを確定（手動ボタンの代替）／復帰時に未送信を再送
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ if(pending) finalizeNow(true); }
    else if(user){ flushOutbox(); }
  });
  window.addEventListener("pagehide", ()=>{ if(pending) finalizeNow(true); });
}
boot();
</script>
</body>
</html>
