<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バス混雑度 計測</title>
<style>
  :root{
    --c1:#16a34a; --c2:#65a30d; --c3:#ca8a04; --c4:#ea580c; --c5:#dc2626; --c6:#991b1b;
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#f1f5f9; --muted:#94a3b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  }
  header{flex:0 0 auto; padding:8px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); background:var(--panel);}
  .sess{flex:1; min-width:0; font-size:12px; color:var(--muted); line-height:1.3;}
  .sess b{color:var(--ink); font-weight:600;}
  .iconbtn{flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:7px 11px; font-size:13px; font-weight:600;}

  main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}

  .picker{flex:0 0 auto; padding:8px 10px; border-bottom:1px solid var(--line);}
  .ptitle{font-size:12px; color:var(--muted); margin:0 2px 6px;}
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .card{
    border:none; border-radius:12px; color:#fff; font-family:inherit; padding:7px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    transition:transform .06s ease;
  }
  .card:active{transform:scale(.94);}
  .card .num{font-size:18px; font-weight:800;}
  .card .lbl{font-size:11px; font-weight:700; line-height:1.1;}
  .card .rng{font-size:10px; opacity:.9;}
  .c1{background:var(--c1);} .c2{background:var(--c2);} .c3{background:var(--c3);}
  .c4{background:var(--c4);} .c5{background:var(--c5);} .c6{background:var(--c6);}

  .log{flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px 10px 14px;}
  .lhead{position:sticky; top:0; background:var(--bg); font-size:12px; color:var(--muted); padding:6px 2px; display:flex; justify-content:space-between; align-items:center;}
  .lexport{border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700; font-family:inherit;}
  .lexport:active{background:var(--line);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:28px 10px;}
  .logrow{display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid #1e2a3d;}
  .chip{flex:0 0 auto; width:26px; height:26px; border-radius:7px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .lt{flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); width:42px;}
  .lmid{flex:1 1 auto; min-width:0;}
  .lcount{font-size:15px; font-weight:700;}
  .lsub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lgps{flex:0 0 auto; font-size:11px; color:var(--muted);}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:16px;}
  .center h2{margin:0; font-size:18px; font-weight:700;}
  .center .hint{color:var(--muted); font-size:13px; margin:0;}
  .selchip{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .selchip .chip{width:24px; height:24px;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:58px; height:58px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:20px; font-weight:700;}
  .stepper button:active{background:var(--line);}
  .count{min-width:110px; font-size:46px; font-weight:800;}
  .row{display:flex; gap:10px; width:100%; max-width:420px;}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:700; font-family:inherit; color:#fff;}
  .btn.primary{background:#2563eb;} .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:#f87171; border:1px solid #7f1d1d; margin-top:6px;}
  .btn:active{filter:brightness(.9);}

  .sheet{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:20;}
  .sheet.open{display:flex;}
  .sheet .panel{width:100%; background:var(--panel); border-radius:18px 18px 0 0; padding:16px 16px 22px;}
  .sheet h3{margin:0 0 12px; font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select{width:100%; padding:13px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; font-family:inherit;}

  .statusbar{flex:0 0 auto; padding:6px 12px; font-size:12px; color:var(--muted); text-align:center; border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .toast{position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(12px); opacity:0; background:#16a34a; color:#fff; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:700; transition:all .2s ease; pointer-events:none; z-index:30;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="sess" id="sess"></div>
  <button class="iconbtn" id="langBtn">EN</button>
  <button class="iconbtn" id="setBtn">⚙</button>
</header>

<main id="main"></main>

<div class="statusbar" id="status"></div>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3 id="setTitle">調査設定</h3>
    <div class="field"><label id="lblRoute">路線 (route_id)</label><input id="fRoute" placeholder="例: 50"></div>
    <div class="field"><label id="lblStop">バス停 / 区間 (busstop_id)</label><input id="fStop" placeholder="例: 学園前→高の原"></div>
    <div class="field"><label id="lblVeh">車両番号 (vehicle_id)</label><input id="fVeh" placeholder="例: 貸切1号車"></div>
    <div class="field"><label id="lblType">回答者 (respondent_type)</label>
      <select id="fType"><option value="staff">スタッフ / staff</option><option value="general">一般 / general</option></select></div>
    <button class="btn primary" id="setSave">保存</button>
    <button class="btn danger" id="clearBtn">全記録を削除</button>
  </div>
</div>

<script>
/* ==========================================================
   ローカル保存版（DB・会員登録なし）
   記録は端末内(localStorage)に保存され、CSVで書き出せます。
   通信は一切行いません。GitHub Pages 等のHTTPSで公開すればGPSも動作。
   ========================================================== */
const APP_VERSION = "trial-0.3-local";
const LS_KEY = "bus_feedback_log_v1";

const session = { route_id:"", busstop_id:"", vehicle_id:"", respondent_type:"staff" };

/* 端末内保存（サンドボックス等で使えない場合はメモリのみにフォールバック） */
function loadLog(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r); }catch(e){} return []; }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(logEntries)); }catch(e){} }
let logEntries = loadLog(); // 新しい順

let lang = "ja";
const T = {
  ja:{
    pick:"混雑度を選択", records:"記録", items:"件", none:"まだ記録がありません", export:"⬇ CSV",
    classes:[
      {lbl:"ガラガラ", rng:"0〜5人"},{lbl:"やや空き", rng:"6〜15人"},{lbl:"席が埋まる", rng:"16〜25人"},
      {lbl:"立ち客", rng:"26〜40人"},{lbl:"混雑", rng:"41〜55人"},{lbl:"満員近い", rng:"56人〜"},
    ],
    countTitle:"正確な人数（任意）", countHint:"数えられれば入力してください",
    send:"この人数で送信", skip:"人数はスキップ", ppl:"人",
    saved:"記録しました", exported:"CSVを書き出しました", noData:"記録がありません",
    cleared:"記録を削除しました", confirmClear:"端末内の全記録を削除します。CSVを書き出し済みですか？",
    set:"調査設定", route:"路線 (route_id)", stop:"バス停 / 区間 (busstop_id)", veh:"車両番号 (vehicle_id)", type:"回答者 (respondent_type)", save:"保存", clear:"全記録を削除",
    gpsOn:"位置情報を取得中…", gpsOk:"位置情報 取得", gpsNo:"位置情報なし",
    hint:"端末内に保存中（会員登録なし）", langLabel:"EN",
    sess:(s)=>`路線 <b>${s.route_id||"—"}</b> / 区間 <b>${s.busstop_id||"—"}</b> · 車両 <b>${s.vehicle_id||"—"}</b> · <b>${s.respondent_type}</b>`,
  },
  en:{
    pick:"Select crowding", records:"Records", items:"", none:"No records yet", export:"⬇ CSV",
    classes:[
      {lbl:"Empty", rng:"0–5"},{lbl:"Light", rng:"6–15"},{lbl:"Seats full", rng:"16–25"},
      {lbl:"Standing", rng:"26–40"},{lbl:"Crowded", rng:"41–55"},{lbl:"Packed", rng:"56+"},
    ],
    countTitle:"Exact count (optional)", countHint:"Enter it if you can count",
    send:"Submit count", skip:"Skip count", ppl:"",
    saved:"Saved", exported:"CSV exported", noData:"No records",
    cleared:"Records cleared", confirmClear:"Delete all records on this device. Did you export the CSV first?",
    set:"Survey settings", route:"Route (route_id)", stop:"Stop / segment (busstop_id)", veh:"Vehicle (vehicle_id)", type:"Respondent (respondent_type)", save:"Save", clear:"Delete all records",
    gpsOn:"Getting location…", gpsOk:"Location captured", gpsNo:"No location",
    hint:"Saved on this device (no sign-up)", langLabel:"日本語",
    sess:(s)=>`Route <b>${s.route_id||"—"}</b> / Seg <b>${s.busstop_id||"—"}</b> · Veh <b>${s.vehicle_id||"—"}</b> · <b>${s.respondent_type}</b>`,
  }
};

const $ = (id)=>document.getElementById(id);
const main = $("main");
let pending = null;

function setStatus(msg){ $("status").textContent = msg || T[lang].hint; }
function toast(msg, color){ const el=$("toast"); el.textContent=msg; el.style.background=color||"#16a34a"; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1400); }
function refreshChrome(){
  $("sess").innerHTML = T[lang].sess(session);
  $("langBtn").textContent = T[lang].langLabel;
  $("setTitle").textContent = T[lang].set;
  $("lblRoute").textContent = T[lang].route; $("lblStop").textContent = T[lang].stop;
  $("lblVeh").textContent = T[lang].veh; $("lblType").textContent = T[lang].type;
  $("setSave").textContent = T[lang].save; $("clearBtn").textContent = T[lang].clear;
  setStatus();
}
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

function renderMain(){
  const t = T[lang];
  let cards = "";
  t.classes.forEach((c,i)=>{
    cards += `<button class="card c${i+1}" onclick="pickClass(${i+1})"><div class="num">${i+1}</div><div class="lbl">${c.lbl}</div><div class="rng">${c.rng}</div></button>`;
  });
  let rows = "";
  if(logEntries.length===0){ rows = `<div class="empty">${t.none}</div>`; }
  else {
    logEntries.forEach(e=>{
      const cls = t.classes[e.congestion_class-1];
      const countTxt = (e.exact_count!==null) ? `${e.exact_count}${t.ppl}` : `<span style="color:var(--muted)">${cls.lbl}</span>`;
      const sub = [e.route_id, e.busstop_id, e.vehicle_id].filter(Boolean).join(" · ") || "—";
      const gps = (e.lat!==null) ? "GPS✓" : "GPS—";
      rows += `<div class="logrow">
        <span class="chip c${e.congestion_class}">${e.congestion_class}</span>
        <span class="lt">${hhmm(e.answered_at)}</span>
        <span class="lmid"><div class="lcount">${countTxt}</div><div class="lsub">${sub}</div></span>
        <span class="lgps">${gps}</span>
      </div>`;
    });
  }
  main.innerHTML = `
    <div class="picker"><p class="ptitle">${t.pick}</p><div class="grid">${cards}</div></div>
    <div class="log">
      <div class="lhead"><span>${t.records} ${logEntries.length}${t.items}</span><button class="lexport" onclick="exportCsv()">${t.export}</button></div>
      ${rows}
    </div>`;
  setStatus();
}

function pickClass(cls){
  pending = { congestion_class:cls, exact_count:null, lat:null, lng:null, gps_accuracy:null, answered_at:new Date().toISOString() };
  captureGps(()=>renderCount());
}
function captureGps(done){
  setStatus(T[lang].gpsOn);
  if(!navigator.geolocation){ setStatus(T[lang].gpsNo); done(); return; }
  navigator.geolocation.getCurrentPosition(
    (p)=>{ pending.lat=p.coords.latitude; pending.lng=p.coords.longitude; pending.gps_accuracy=p.coords.accuracy; setStatus(T[lang].gpsOk); done(); },
    ()=>{ setStatus(T[lang].gpsNo); done(); },
    { enableHighAccuracy:true, timeout:8000, maximumAge:3000 }
  );
}

function renderCount(){
  const t = T[lang]; let n = 0;
  const cls = t.classes[pending.congestion_class-1];
  main.innerHTML = `
    <div class="center">
      <div class="selchip"><span class="chip c${pending.congestion_class}">${pending.congestion_class}</span>${cls.lbl}（${cls.rng}）</div>
      <h2>${t.countTitle}</h2><p class="hint">${t.countHint}</p>
      <div class="stepper">
        <button data-d="-10">−10</button><button data-d="-1">−</button>
        <div class="count" id="cval">0</div>
        <button data-d="1">＋</button><button data-d="10">+10</button>
      </div>
      <div class="row"><button class="btn primary" id="sendBtn">${t.send}</button></div>
      <div class="row"><button class="btn ghost" id="skipBtn">${t.skip}</button></div>
    </div>`;
  const cval = $("cval");
  const show = ()=>{ cval.textContent = n>=70 ? "70+" : n; };
  main.querySelectorAll(".stepper button").forEach(b=>{ b.onclick=()=>{ n=Math.max(0,Math.min(70,n+parseInt(b.dataset.d,10))); show(); }; });
  $("sendBtn").onclick = ()=>{ pending.exact_count = n; commit(); };
  $("skipBtn").onclick = ()=>{ pending.exact_count = null; commit(); };
}

/* 完了 → 端末内に保存 → ログへ */
function commit(){
  const rec = {
    answered_at: pending.answered_at, respondent_type: session.respondent_type, respondent_id: "",
    congestion_class: pending.congestion_class, exact_count: pending.exact_count,
    lat: pending.lat, lng: pending.lng, gps_accuracy: pending.gps_accuracy,
    route_id: session.route_id, busstop_id: session.busstop_id, vehicle_id: session.vehicle_id,
    lang: lang, app_version: APP_VERSION,
  };
  logEntries.unshift(rec);
  persist();
  renderMain();
  toast(T[lang].saved);
}

/* CSV書き出し */
const CSV_COLS = ["answered_at","respondent_type","respondent_id","congestion_class","exact_count","lat","lng","gps_accuracy","route_id","busstop_id","vehicle_id","lang","app_version"];
function csvCell(v){ if(v===null||v===undefined) return ""; const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCsv(){
  const t = T[lang];
  if(logEntries.length===0){ toast(t.noData, "#dc2626"); return; }
  const rows = logEntries.slice().reverse(); // 古い順で書き出し
  const csv = [CSV_COLS.join(",")].concat(rows.map(e=>CSV_COLS.map(c=>csvCell(e[c])).join(","))).join("\n");
  const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  const veh = (session.vehicle_id||"veh").replace(/[^\w一-龠ぁ-んァ-ヶ]/g,"");
  a.href=url; a.download=`bus_feedback_${veh}_${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t.exported);
}

/* 設定 */
$("setBtn").onclick = ()=>{ $("fRoute").value=session.route_id; $("fStop").value=session.busstop_id; $("fVeh").value=session.vehicle_id; $("fType").value=session.respondent_type; $("sheet").classList.add("open"); };
$("sheet").onclick = (e)=>{ if(e.target.id==="sheet") $("sheet").classList.remove("open"); };
$("setSave").onclick = ()=>{ session.route_id=$("fRoute").value.trim(); session.busstop_id=$("fStop").value.trim(); session.vehicle_id=$("fVeh").value.trim(); session.respondent_type=$("fType").value; $("sheet").classList.remove("open"); refreshChrome(); renderMain(); };
$("clearBtn").onclick = ()=>{ if(confirm(T[lang].confirmClear)){ logEntries.length=0; persist(); $("sheet").classList.remove("open"); renderMain(); toast(T[lang].cleared, "#dc2626"); } };
$("langBtn").onclick = ()=>{ lang=(lang==="ja")?"en":"ja"; refreshChrome(); renderMain(); };

refreshChrome();
renderMain();
</script>
</body>
</html>
